[project]
name = "incidentlens"
version = "0.1.0"
description = "Autonomous AI SRE copilot for evidence-driven incident investigation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "langgraph>=0.2",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Higher-quality semantic runbook retrieval; without either, the retriever falls
# back to dependency-free lexical (hashing) matching.
voyage = ["voyageai>=0.2"]
local-embeddings = ["sentence-transformers>=2.2"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit so packaging never sweeps in tests/ or demo/.
py-modules = ["main", "config", "schemas", "orchestrator", "metrics", "embeddings"]
packages = ["agents", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, flake8-bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = [
    "agents",
    "tools",
    "config",
    "schemas",
    "orchestrator",
    "metrics",
    "embeddings",
]
